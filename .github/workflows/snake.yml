# Place this file at:  .github/workflows/snake.yml  in the yashadake/yashadake repo.
# (This replaces the earlier version — same mechanics, but the snake + dots now use
#  the neon pink/purple palette so it matches the gradient README.)
#
# It regenerates the contribution-snake SVGs daily and pushes them to an
# orphan branch named `output`, which the README <picture> block points at.
# IMPORTANT: after committing, go to Actions → "Generate contribution snake"
# → "Run workflow" once. Until that first run, the README shows a broken image.

name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF0080&color_dots=#f3e8ff,#d8b4fe,#a855f7,#7928CA,#4A00E0
            dist/github-snake-dark.svg?color_snake=#00DFD8&color_dots=#0D0221,#4C1D95,#7928CA,#C77DFF,#FF0080

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
